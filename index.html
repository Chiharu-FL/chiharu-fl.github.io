<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>佐藤千春 | Chiharu Sato</title>
<meta name="description" content="フルート奏者・講師 佐藤千春のオフィシャルサイト（準備中）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ee;
    --ink: #2f2a26;
    --soft: #8a7f74;
    --accent: #b08d57;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif JP", serif;
    text-align: center;
    padding: 40px 16px;
  }
  .wrap { max-width: 560px; }
  .en {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    font-weight: 400;
    letter-spacing: 0.08em;
  }
  .ja {
    margin-top: 8px;
    font-size: 1rem;
    letter-spacing: 0.4em;
    color: var(--soft);
  }
  .line {
    width: 48px;
    height: 1px;
    background: var(--accent);
    margin: 32px auto;
  }
  .role {
    font-size: 0.95rem;
    line-height: 2;
    letter-spacing: 0.1em;
  }
  .soon {
    margin-top: 32px;
    font-family: "Cormorant Garamond", serif;
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    color: var(--accent);
  }
  .contact {
    margin-top: 40px;
    font-size: 0.85rem;
    color: var(--soft);
  }
  .contact a { color: var(--ink); }
</style>
</head>
<body>
  <main class="wrap">
    <h1 class="en">Chiharu Sato</h1>
    <p class="ja">佐藤 千春</p>
    <div class="line"></div>
    <p class="role">フルート奏者・講師<br>コンサートプロデュース<br>音楽家のための整体</p>
    <p class="soon">Coming Soon</p>
    <p class="contact">お問い合わせ<br><a href="mailto:contact@chiharusato.com">contact@chiharusato.com</a></p>
  </main>
</body>
</html>
